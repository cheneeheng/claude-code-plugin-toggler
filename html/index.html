<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Plugin Toggler</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1>Skills Toggle <span id="live-indicator" class="live-dot" title="Live updates active"></span></h1>
      <button class="btn-danger" id="btn-kill-server">Stop server</button>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="light">Light</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
        <button class="theme-btn" data-theme="">System</button>
      </div>
    </div>
  </header>

  <div class="project-card" id="project-card">
    <div class="project-label">PROJECT</div>
    <div class="project-card-row">
      <span class="project-name" id="project-name"></span>
      <button class="project-change-btn" id="project-change-btn">Change &#9660;</button>
    </div>
    <div class="project-path" id="project-path"></div>
    <div class="project-picker-expand" id="project-picker-expand">
      <div class="project-picker-row">
        <input type="text" class="project-picker-input" id="project-path-input" />
        <button id="project-apply-btn">Apply</button>
      </div>
      <div class="project-picker-error" id="project-picker-error"></div>
    </div>
  </div>

  <div class="mock-notice" id="mock-notice" style="display:none">
    &#9888; Mock data &#8212; <code>~/.claude/plugins/installed_plugins.json</code> not found.
    <button onclick="document.getElementById('mock-notice').style.display='none'">&#10005;</button>
  </div>

  <div id="status" class="status">Loading plugins...</div>
  <div id="error" class="error-msg" style="display:none"></div>

  <div id="plugin-sections" style="display:none">
    <div id="local-section">
      <div class="section-title">Local plugins <span id="loading-spinner" class="loading-spinner" style="display:none" title="Loading plugins..."></span></div>
      <div class="plugin-list" id="local-list"></div>
    </div>
    <div id="project-section">
      <div class="section-title">Project plugins</div>
      <div class="plugin-list" id="project-list"></div>
    </div>
    <div id="user-section">
      <div class="section-title">User plugins</div>
      <div class="plugin-list" id="user-list"></div>
    </div>
  </div>

  <div class="bulk-actions" id="bulk-actions" style="display:none">
    <div>
      <button id="btn-enable-all">Enable all</button>
      <button id="btn-disable-all">Disable all</button>
    </div>
    <button class="bulk-install-btn" id="btn-install-plugin" onclick="openInstallPanel()">+ Install/Uninstall plugin</button>
  </div>

  <div class="install-panel" id="install-panel"></div>

  <script>
    // ---- theme ----
    function setTheme(t) {
      if (t) document.documentElement.setAttribute("data-theme", t);
      else document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("skills-theme", t ?? "");
      document.querySelectorAll(".theme-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.theme === t);
      });
    }
    (function initTheme() {
      const saved = localStorage.getItem("skills-theme");
      if (saved !== null) setTheme(saved);
    })();
    document.querySelectorAll(".theme-btn").forEach((b) => {
      b.addEventListener("click", () => setTheme(b.dataset.theme));
    });

    // ---- state ----
    const SCOPES = ["local", "project", "user"];
    const SCOPE_LABELS = { local: "Local", project: "Project", user: "User" };
    let state = { local: [], project: [], user: [] };
    let installedScopesMap = {};   // { id: ["local", "user"] } from /api/plugins (ITER_17)
    let marketplaces = [];
    let installPanelOpen = false;
    let selectedMarketplace = null;
    let operationInProgress = false;

    // ---- load ----
    async function fetchPlugins() {
      const spinner = document.getElementById("loading-spinner");
      if (document.getElementById("plugin-sections").style.display !== "none") {
        spinner.style.display = "inline-block";
      }
      try {
        const res = await fetch("/api/plugins");
        const data = await res.json();
        if (!res.ok) {
          const pathInfo = data.path ? ` (${data.path})` : "";
          throw new Error(`${data.error || `HTTP ${res.status}`}${pathInfo}`);
        }
        const projectRoot = data.project_root || "";
        const folderName = projectRoot
          ? projectRoot.replace(/\\/g, "/").split("/").filter(Boolean).pop() || projectRoot
          : "";
        document.getElementById("project-name").textContent = folderName;
        document.getElementById("project-path").textContent = projectRoot;
        document.getElementById("project-path-input").value = projectRoot;
        document.getElementById("mock-notice").style.display = data.mock ? "flex" : "none";
        state.local = data.local || [];
        state.project = data.project || [];
        state.user = data.user || [];
        installedScopesMap = data.installedScopes || {};
        renderPlugins();
        if (installPanelOpen) renderInstallPanel();
      } catch (err) {
        document.getElementById("loading-spinner").style.display = "none";
        showError(`Failed to load plugins: ${err.message}`);
      }
    }

    // ---- fetch marketplace data ----
    async function fetchMarketplace() {
      try {
        const res = await fetch("/api/marketplace");
        const data = await res.json();
        marketplaces = data.marketplaces || [];
        if (installPanelOpen) renderInstallPanel();
      } catch (_) {
        // Marketplace data is best-effort; don't surface errors here
      }
    }

    // ---- render ----
    function renderPlugins() {
      document.getElementById("loading-spinner").style.display = "none";
      const sections = document.getElementById("plugin-sections");
      const bulk = document.getElementById("bulk-actions");

      const total = SCOPES.reduce((n, s) => n + state[s].length, 0);
      if (total === 0) {
        showStatus("No plugins found for this project. Install plugins via Claude Code.");
        sections.style.display = "none";
        bulk.style.display = "none";
        return;
      }

      document.getElementById("status").style.display = "none";
      sections.style.display = "block";
      bulk.style.display = "flex";

      for (const scope of SCOPES) {
        document.getElementById(`${scope}-list`).innerHTML =
          state[scope].length
            ? state[scope].map((p) => sectionRowHtml(p, scope)).join("")
            : `<div class="section-empty">No plugins in this scope</div>`;
      }

      document.querySelectorAll(".toggle").forEach((el) => {
        el.addEventListener("change", (e) =>
          toggle(e.target.dataset.id, e.target.checked, e.target, e.target.dataset.scope)
        );
      });
    }

    function renderSkillsDisclosure(skills) {
      if (!skills || skills.length === 0) return "";
      const rows = skills.map((s) => `
        <div class="skill-row">
          <div class="skill-name">${esc(s.name)}</div>
          ${s.description ? `<div class="skill-description">${esc(s.description)}</div>` : ""}
        </div>`).join("");
      return `
        <div class="skills-disclosure">
          <button class="skills-toggle-btn" data-label="skill" onclick="toggleDisclosure(this)">
            ${skills.length} skill${skills.length !== 1 ? "s" : ""} &#9658;
          </button>
          <div class="skills-list">${rows}</div>
        </div>`;
    }

    function renderAgentsDisclosure(agents) {
      if (!agents || agents.length === 0) return "";
      const rows = agents.map((a) => `
        <div class="skill-row">
          <div class="skill-name">${esc(a.name)}</div>
          ${a.description ? `<div class="skill-description">${esc(a.description)}</div>` : ""}
        </div>`).join("");
      return `
        <div class="skills-disclosure">
          <button class="skills-toggle-btn" data-label="agent" onclick="toggleDisclosure(this)">
            ${agents.length} agent${agents.length !== 1 ? "s" : ""} &#9658;
          </button>
          <div class="skills-list">${rows}</div>
        </div>`;
    }

    function renderHooksDisclosure(hooks) {
      if (!hooks || hooks.length === 0) return "";
      const blocks = hooks.map((h) => {
        const matcher = h.matcher ? `<span class="hook-matcher">matcher: ${esc(h.matcher)}</span>` : "";
        const actions = (h.actions || []).map((a) =>
          `<div class="hook-action"><span class="hook-type">${esc(a.type)}</span> — <span class="hook-detail">${esc(a.detail)}</span></div>`
        ).join("");
        return `
          <div class="hook-block">
            <div class="hook-event">${esc(h.event)} ${matcher}</div>
            ${actions}
          </div>`;
      }).join("");
      return `
        <div class="skills-disclosure">
          <button class="skills-toggle-btn" data-label="hook" data-count="${hooks.length}" onclick="toggleDisclosure(this)">
            ${hooks.length} hook${hooks.length !== 1 ? "s" : ""} &#9658;
          </button>
          <div class="skills-list">${blocks}</div>
        </div>`;
    }

    function toggleDisclosure(btn) {
      const list = btn.nextElementSibling;
      const open = list.classList.toggle("is-open");
      const count = btn.dataset.count !== undefined
        ? btn.dataset.count
        : list.querySelectorAll(".skill-row").length;
      const label = btn.dataset.label || "skill";
      btn.textContent = `${count} ${label}${count != 1 ? "s" : ""} ${open ? "▾" : "▸"}`;
    }

    // Scope-qualified element-id bundles (ITER_13/15/17). ids are built with CSS.escape
    // on both sides so getElementById matches the literal (escaped) id.
    function sectionInstallEls(scope, id) {
      const e = CSS.escape(id);
      return { btn: `btn-install-${scope}-${e}`, log: `log-${scope}-${e}`, err: `err-${scope}-${e}` };
    }
    function sectionUninstallEls(scope, id) {
      const e = CSS.escape(id);
      return { btn: `btn-uninstall-${scope}-${e}`, log: `log-${scope}-${e}`, err: `err-${scope}-${e}` };
    }
    function mpEls(id) {
      const e = CSS.escape(id);
      return { btn: `mp-btn-${e}`, log: `mp-log-${e}`, err: `mp-err-${e}` };
    }
    // Read the selected install scope at click time (CSS.escape applied at runtime so it
    // matches the select's id attribute — never embed the escaped form into an onclick literal).
    function mpScopeVal(id) {
      const sel = document.getElementById(`mp-scope-${CSS.escape(id)}`);
      return sel ? sel.value : "local";
    }

    function sectionRowHtml(p, scope) {
      const escId = esc(p.id);
      const e = CSS.escape(p.id);
      const installed = p.installed !== false;

      const disclosures = installed
        ? renderSkillsDisclosure(p.skills) + renderAgentsDisclosure(p.agents) + renderHooksDisclosure(p.hooks)
        : "";

      const actionBtn = installed
        ? `<button class="mp-install-btn mp-install-btn--uninstall" id="btn-uninstall-${scope}-${e}"
                   onclick="uninstallPlugin('${escId}','${scope}', sectionUninstallEls('${scope}','${escId}'))">Uninstall</button>`
        : `<button class="mp-install-btn" id="btn-install-${scope}-${e}"
                   onclick="installPlugin('${escId}','${scope}', sectionInstallEls('${scope}','${escId}'))">Install &#8595;</button>`;

      return `
        <div class="plugin-row" id="row-${scope}-${e}" data-id="${escId}">
          <div class="plugin-row-main">
            <div class="plugin-info">
              <span class="plugin-name">${esc(p.name)}</span>
              <div class="plugin-badges">
                ${p.marketplace ? `<span class="marketplace-badge">@${esc(p.marketplace)}</span>` : ""}
                ${p.version ? `<span class="version-badge">v${esc(p.version)}</span>` : ""}
                ${!installed ? `<span class="not-installed-tag">Not installed</span>` : ""}
              </div>
              ${disclosures}
            </div>
            <div class="row-actions">
              <input type="checkbox" class="toggle" id="toggle-${scope}-${e}"
                     data-id="${escId}" data-scope="${scope}" ${p.enabled ? "checked" : ""} />
              ${actionBtn}
            </div>
          </div>
          <div class="mp-install-error" id="err-${scope}-${e}"></div>
          <div class="mp-install-log" id="log-${scope}-${e}"></div>
        </div>`;
    }

    // ---- toggle (scope-aware, ITER_14) ----
    async function toggle(id, enabled, el, scope) {
      el.disabled = true;
      const prev = !enabled;
      const p = (state[scope] || []).find((x) => x.id === id);
      if (p) p.enabled = enabled;
      const errEl = document.getElementById(`err-${scope}-${CSS.escape(id)}`);
      if (errEl) { errEl.textContent = ""; errEl.classList.remove("visible"); }
      try {
        const res = await fetch("/api/toggle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, enabled, scope }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `HTTP ${res.status}`);
        }
      } catch (err) {
        if (p) p.enabled = prev;
        el.checked = prev;
        if (errEl) {
          errEl.textContent = `Toggle failed: ${err.message}`;
          errEl.classList.add("visible");
        } else {
          showError(`Toggle failed: ${err.message}`);
        }
      } finally {
        el.disabled = false;
      }
    }

    // ---- bulk (Local scope only — Project/User are higher blast radius) ----
    async function bulkToggle(enabled) {
      const buttons = document.querySelectorAll(".bulk-actions button");
      buttons.forEach((b) => (b.disabled = true));
      for (const p of state.local) {
        if (p.enabled !== enabled) {
          const el = document.getElementById(`toggle-local-${CSS.escape(p.id)}`);
          if (el) await toggle(p.id, enabled, el, "local");
        }
      }
      buttons.forEach((b) => (b.disabled = false));
      renderPlugins();
    }

    // ---- project card ----
    document.getElementById("project-change-btn").addEventListener("click", () => {
      const expand = document.getElementById("project-picker-expand");
      const btn = document.getElementById("project-change-btn");
      const isOpen = expand.classList.toggle("is-open");
      btn.innerHTML = isOpen ? "Change &#9650;" : "Change &#9660;";
    });

    document.getElementById("project-apply-btn").addEventListener("click", async () => {
      const input = document.getElementById("project-path-input");
      const applyBtn = document.getElementById("project-apply-btn");
      const errEl = document.getElementById("project-picker-error");
      const newPath = input.value.trim();

      input.disabled = true;
      applyBtn.disabled = true;
      errEl.classList.remove("visible");

      try {
        const res = await fetch("/api/set-project", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: newPath }),
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById("project-picker-expand").classList.remove("is-open");
          document.getElementById("project-change-btn").innerHTML = "Change &#9660;";
          await fetchPlugins();
          await fetchMarketplace();
        } else {
          errEl.textContent = data.error || "Unknown error";
          errEl.classList.add("visible");
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add("visible");
      } finally {
        input.disabled = false;
        applyBtn.disabled = false;
      }
    });

    // ---- install panel ----
    function openInstallPanel() {
      installPanelOpen = true;
      if (!selectedMarketplace && marketplaces.length > 0) {
        selectedMarketplace = marketplaces[0].key;
      }
      renderInstallPanel();
      document.getElementById("install-panel").classList.add("is-open");
    }

    function closeInstallPanel() {
      installPanelOpen = false;
      document.getElementById("install-panel").classList.remove("is-open");
    }

    async function triggerMarketplaceRefresh() {
      const btn   = document.getElementById("marketplace-refresh-btn");
      const logEl = document.getElementById("marketplace-refresh-log");
      if (!btn || !logEl) return;

      btn.disabled = true;
      btn.textContent = "↻ Refreshing…";
      logEl.textContent = "";
      logEl.classList.add("is-open");

      try {
        const res = await fetch("/api/marketplace-refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const dataLine = part.split("\n").find((l) => l.startsWith("data: "));
            if (!dataLine) continue;
            const payload = JSON.parse(dataLine.slice(6));

            if (payload.type === "line") {
              logEl.textContent += payload.text;
              logEl.scrollTop = logEl.scrollHeight;
            } else if (payload.type === "done") {
              if (!payload.ok) throw new Error(payload.error || "Refresh failed");
            }
          }
        }

        logEl.classList.remove("is-open");
        await fetchMarketplace();

      } catch (err) {
        logEl.textContent += `\nError: ${err.message}`;
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "↻ Refresh";
        }
      }
    }

    function renderInstallPanel() {
      const panel = document.getElementById("install-panel");

      if (marketplaces.length === 0) {
        panel.innerHTML = `
          <div class="install-panel-header">
            <span class="install-panel-title">Install plugin</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <button class="marketplace-refresh-btn" id="marketplace-refresh-btn"
                      onclick="triggerMarketplaceRefresh()">&#8635; Refresh</button>
              <button class="install-panel-close" onclick="closeInstallPanel()">&#10005; Close</button>
            </div>
          </div>
          <div class="mp-install-log" id="marketplace-refresh-log"></div>
          <div class="status">No marketplaces configured. Add marketplaces via Claude Code before installing plugins.</div>`;
        return;
      }

      const options = marketplaces
        .map((m) => `<option value="${esc(m.key)}" ${m.key === selectedMarketplace ? "selected" : ""}>${esc(m.key)}</option>`)
        .join("");

      const mp = marketplaces.find((m) => m.key === selectedMarketplace);
      let pluginListHtml = "";
      if (mp) {
        if (mp.error) {
          pluginListHtml = `<div class="mp-install-error visible">${esc(mp.error)}</div>`;
        } else if (mp.plugins.length === 0) {
          pluginListHtml = `<div class="status">No plugins found in this marketplace.</div>`;
        } else {
          pluginListHtml = mp.plugins.map(renderMpPluginRow).join("");
        }
      }

      panel.innerHTML = `
        <div class="install-panel-header">
          <span class="install-panel-title">Install plugin</span>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="marketplace-refresh-btn" id="marketplace-refresh-btn"
                    onclick="triggerMarketplaceRefresh()">&#8635; Refresh</button>
            <button class="install-panel-close" onclick="closeInstallPanel()">&#10005; Close</button>
          </div>
        </div>
        <div class="mp-install-log" id="marketplace-refresh-log"></div>
        <div class="marketplace-select-row">
          <span class="marketplace-select-label">Marketplace</span>
          <select class="marketplace-select" onchange="selectedMarketplace = this.value; renderInstallPanel()">
            ${options}
          </select>
        </div>
        <div class="mp-plugin-list">${pluginListHtml}</div>`;
    }

    function renderMpPluginRow(p) {
      const escId = esc(p.id);
      const e = CSS.escape(p.id);
      const installedScopes = installedScopesMap[p.id] || [];
      const notInstalled = SCOPES.filter((s) => !installedScopes.includes(s));

      const tags = installedScopes
        .map((s) => `<span class="install-status">&#10003; Installed &middot; ${SCOPE_LABELS[s]}</span>`)
        .join(" ");

      const keywords = (p.keywords || [])
        .map((k) => `<span class="mp-keyword">${esc(k)}</span>`)
        .join("");

      let installControl = "";
      if (notInstalled.length > 0) {
        const opts = notInstalled
          .map((s, i) => `<option value="${s}" ${i === 0 ? "selected" : ""}>${SCOPE_LABELS[s]}</option>`)
          .join("");
        installControl = `
          <select class="mp-scope-select" id="mp-scope-${e}">${opts}</select>
          <button class="mp-install-btn" id="mp-btn-${e}"
                  onclick="installPlugin('${escId}', mpScopeVal('${escId}'), mpEls('${escId}'))">
            Install &#8595;
          </button>`;
      }

      return `
        <div class="mp-plugin-row" id="mp-row-${e}">
          <div class="mp-plugin-main">
            <span class="mp-plugin-name">${esc(p.name)}</span>
            ${p.version ? `<span class="version-badge">v${esc(p.version)}</span>` : ""}
            ${tags}
          </div>
          <div class="mp-install-col">${installControl}</div>
          ${p.description ? `<div class="mp-plugin-description">${esc(p.description)}</div>` : ""}
          ${keywords ? `<div class="mp-keyword-list">${keywords}</div>` : ""}
          <div class="mp-install-error" id="mp-err-${e}"></div>
          <div class="mp-install-log" id="mp-log-${e}"></div>
        </div>`;
    }

    // ---- streamed install / uninstall (scope-aware, row-agnostic via els) ----
    async function _streamOp(endpoint, body, els, labels) {
      const btn   = els.btn ? document.getElementById(els.btn) : null;
      const errEl = els.err ? document.getElementById(els.err) : null;
      const logEl = els.log ? document.getElementById(els.log) : null;

      operationInProgress = true;
      if (btn)   { btn.textContent = labels.progress; btn.disabled = true; }
      if (errEl) { errEl.textContent = ""; errEl.classList.remove("visible"); }
      if (logEl) { logEl.textContent = ""; logEl.classList.add("is-open"); }

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";
        let   success = false;

        outer: while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const dataLine = part.split("\n").find((l) => l.startsWith("data: "));
            if (!dataLine) continue;
            const payload = JSON.parse(dataLine.slice(6));

            if (payload.type === "line") {
              if (logEl) { logEl.textContent += payload.text; logEl.scrollTop = logEl.scrollHeight; }
            } else if (payload.type === "done") {
              if (payload.ok) success = true;
              else throw new Error(payload.error || labels.failed);
              break outer;
            }
          }
        }
        reader.cancel().catch(() => {});

        if (success) {
          await new Promise((r) => setTimeout(r, 3000));
          operationInProgress = false;
          if (logEl) logEl.classList.remove("is-open");
          await Promise.all([fetchPlugins(), fetchMarketplace()]);
        }
      } catch (err) {
        operationInProgress = false;
        if (btn)   { btn.innerHTML = labels.idle; btn.disabled = false; }
        if (logEl) logEl.classList.remove("is-open");
        if (errEl) { errEl.textContent = `${labels.failed}: ${err.message}`; errEl.classList.add("visible"); }
      }
    }

    function installPlugin(id, scope, els) {
      return _streamOp("/api/install-stream", { id, scope }, els,
        { progress: "Installing…", idle: "Install &#8595;", failed: "Install failed" });
    }

    function uninstallPlugin(id, scope, els) {
      return _streamOp("/api/uninstall-stream", { id, scope }, els,
        { progress: "Uninstalling…", idle: "Uninstall", failed: "Uninstall failed" });
    }

    // ---- SSE event stream (ITER_06) ----
    function setLiveIndicator(state) {
      const el = document.getElementById("live-indicator");
      el.className = "live-dot" + (state !== "off" ? ` ${state}` : "");
    }

    function connectEventStream() {
      const es = new EventSource("/api/events");

      es.onopen = () => setLiveIndicator("connected");

      es.onmessage = (event) => {
        if (event.data === "refresh") {
          // While a streamed install/uninstall is finishing, defer the refresh so the
          // result log stays visible for its 3s window. _streamOp re-fetches plugins +
          // marketplace itself once that window closes.
          if (operationInProgress) return;
          fetchPlugins();
          if (installPanelOpen) fetchMarketplace();
        }
      };

      es.onerror = () => {
        setLiveIndicator("reconnecting");
        es.close();
        setTimeout(connectEventStream, 3000);
      };
    }

    // ---- helpers ----
    function showStatus(html) {
      const s = document.getElementById("status");
      s.innerHTML = html;
      s.style.display = "block";
      document.getElementById("error").style.display = "none";
    }

    function showError(msg) {
      const e = document.getElementById("error");
      e.textContent = msg;
      e.style.display = "block";
      document.getElementById("status").style.display = "none";
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("btn-enable-all").addEventListener("click", () => bulkToggle(true));
    document.getElementById("btn-disable-all").addEventListener("click", () => bulkToggle(false));

    document.getElementById("btn-kill-server").addEventListener("click", async () => {
      const btn = document.getElementById("btn-kill-server");
      btn.disabled = true;
      btn.textContent = "Stopping...";
      try {
        await fetch("/api/shutdown", { method: "POST" });
      } catch (_) {
        // connection drop on shutdown is expected
      }
      document.body.innerHTML =
        '<p style="padding:1.25rem;font-family:sans-serif;color:#e05c5c">Server stopped.</p>';
    });

    fetchPlugins();
    fetchMarketplace();
    connectEventStream();
  </script>
</body>
</html>
